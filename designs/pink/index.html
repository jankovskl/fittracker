<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <meta name="theme-color" content="#ec4899">
    <link rel="manifest" href="manifest.json">
    <title>FitTrack - Workout Tracker</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #1a1a1a;
            --surface-light: #2a2a2a;
            --text: #fefefe;
            --text-muted: #a0a0a0;
            --accent: #ec4899;
            --accent-dark: #db2777;
            --accent-glow: rgba(236, 72, 153, 0.3);
            --danger: #ef4444;
            --warning: #ec4899;
            --info: #f97316;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            background-image: radial-gradient(ellipse at 20% 50%, rgba(236, 72, 153, 0.04) 0%, transparent 60%);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            font-size: 1.05rem;
        }
        header {
            background: linear-gradient(135deg, #111 0%, #1a1a1a 100%);
            padding: 1.25rem 2rem;
            border-bottom: 1px solid rgba(236, 72, 153, 0.12);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
        }
        .logo {
            font-size: 1.75rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ec4899, #f472b6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
        }
        nav { display: flex; gap: 0.5rem; }
        .nav-btn {
            background: transparent;
            border: 1px solid rgba(236, 72, 153, 0.2);
            color: var(--text);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .nav-btn:hover, .nav-btn.active {
            background: linear-gradient(135deg, #ec4899, #db2777);
            border-color: #ec4899;
            color: #000;
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.3);
        }
        main { max-width: 1600px; margin: 0 auto; padding: 2rem; align-items: start; }
        main.editing { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
        #day-editor.hidden { display: none; }
        #right-col { display: none; }
        main.editing #right-col { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes glow { 0%, 100% { box-shadow: 0 0 10px rgba(236, 72, 153, 0.1); } 50% { box-shadow: 0 0 25px rgba(236, 72, 153, 0.2); } }
        .card {
            background: linear-gradient(145deg, #1a1a1a, #151515);
            border-radius: 1rem;
            padding: 2rem;
            margin-bottom: 1.25rem;
            border: 1px solid rgba(236, 72, 153, 0.08);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            animation: fadeIn 0.3s ease;
        }
        .card-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 1.25rem; color: var(--text); }
        label { display: block; font-size: 0.95rem; color: var(--text-muted); margin-bottom: 0.4rem; letter-spacing: 0.02em; }
        input, select {
            width: 100%;
            padding: 0.8rem 0.9rem;
            border-radius: 0.5rem;
            border: 1px solid rgba(236, 72, 153, 0.12);
            background: rgba(0,0,0,0.4);
            color: var(--text);
            font-size: 1.05rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 12px rgba(236, 72, 153, 0.15); }
        .row { display: flex; gap: 1rem; flex-wrap: wrap; align-items: flex-end; }
        .row > * { flex: 1; min-width: 120px; }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.8rem 1.25rem;
            border-radius: 0.5rem;
            border: none;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.02em;
        }
        .btn-primary {
            background: linear-gradient(135deg, #ec4899, #db2777);
            color: #000;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.25);
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #f472b6, #ec4899);
            box-shadow: 0 6px 25px rgba(236, 72, 153, 0.4);
            transform: translateY(-1px);
        }
        .btn-primary:active { transform: translateY(0); }
        .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
        .btn-danger:hover { background: linear-gradient(135deg, #f87171, #ef4444); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); }
        .btn-secondary {
            background: linear-gradient(135deg, #2a2a2a, #222);
            color: var(--text);
            border: 1px solid rgba(236, 72, 153, 0.1);
        }
        .btn-secondary:hover { background: linear-gradient(135deg, #333, #2a2a2a); border-color: rgba(236, 72, 153, 0.25); }
        .btn-icon { padding: 0.45rem; min-width: 2.25rem; }
        .btn-icon-sm { padding: 0.3rem 0.5rem; font-size: 0.85rem; min-width: 1.75rem; }
        .day-card {
            background: linear-gradient(145deg, #1a1a1a, #161616);
            border: 1px solid rgba(236, 72, 153, 0.08);
            border-radius: 0.75rem;
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            animation: fadeIn 0.3s ease;
        }
        .day-card:hover { transform: translateY(-3px); border-color: rgba(236, 72, 153, 0.3); box-shadow: 0 8px 30px rgba(236, 72, 153, 0.08); }
        .day-card h3 { font-size: 1.3rem; margin-bottom: 0.25rem; }
        .day-card small { color: var(--text-muted); font-size: 1rem; }
        .day-card .arrow { color: var(--accent); font-size: 1.4rem; }
        .empty-state { text-align: center; color: var(--text-muted); padding: 4rem 1.5rem; }
        .empty-state h2 { color: var(--text); margin-bottom: 0.5rem; font-size: 1.3rem; }
        .timer-card {
            background: linear-gradient(135deg, #1a1a1a 0%, #1a1500 50%, #1a1a1a 100%);
            text-align: center;
            padding: 2.5rem;
            border: 1px solid rgba(236, 72, 153, 0.12);
            animation: glow 3s infinite;
        }
        .timer-display {
            font-size: 5rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            margin: 1.25rem 0;
            background: linear-gradient(135deg, #ec4899, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .timer-controls { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
        .quick-times { display: flex; gap: 0.65rem; justify-content: center; margin-top: 1.25rem; flex-wrap: wrap; }
        .quick-times button {
            background: rgba(236, 72, 153, 0.08);
            color: var(--accent);
            border: 1px solid rgba(236, 72, 153, 0.15);
            padding: 0.55rem 1rem;
            border-radius: 0.4rem;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .quick-times button:hover { background: var(--accent); color: #000; border-color: var(--accent); }
        .exercise-row {
            display: grid;
            grid-template-columns: 2fr 6rem 6rem 6rem 3rem;
            gap: 0.75rem;
            align-items: center;
            background: rgba(0,0,0,0.3);
            padding: 0.8rem;
            border-radius: 0.5rem;
            margin-bottom: 0.65rem;
            cursor: grab;
            border: 1px solid rgba(236, 72, 153, 0.05);
            transition: border-color 0.15s;
        }
        .exercise-row:hover { border-color: rgba(236, 72, 153, 0.15); }
        .exercise-row.dragging { opacity: 0.4; cursor: grabbing; }
        .exercise-row.drag-over { border-left: 3px solid var(--accent); background: rgba(236, 72, 153, 0.05); }
        .exercise-row input { margin-bottom: 0; text-align: center; }
        .exercise-row .name { text-align: left; font-weight: 600; }
        .header-row {
            font-size: 0.85rem;
            color: var(--text-muted);
            background: transparent;
            padding: 0 0.8rem;
            margin-bottom: 0.35rem;
            border: none;
        }
        .header-row:hover { border-color: transparent; }
        .header-row span { text-align: center; }
        .header-row span:first-child { text-align: left; }
        .last-saved { color: var(--text-muted); font-size: 1rem; }
        .progress-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1.25rem; margin-bottom: 1.5rem; }
        .stat-box {
            background: linear-gradient(145deg, #1a1a1a, #141414);
            border-radius: 0.75rem;
            padding: 1.25rem;
            text-align: center;
            border: 1px solid rgba(236, 72, 153, 0.08);
        }
        .stat-box .value {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ec4899, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-box .label { font-size: 0.95rem; color: var(--text-muted); }
        .chart-card {
            background: rgba(0,0,0,0.3);
            border-radius: 0.75rem;
            padding: 1.25rem;
            border: 1px solid rgba(236, 72, 153, 0.08);
        }
        .chart-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1rem; }
        .chart-legend { display: flex; gap: 1.25rem; font-size: 0.9rem; }
        .legend-dot { display: inline-block; width: 0.6rem; height: 0.6rem; border-radius: 50%; margin-right: 0.25rem; }
        .back-link { color: var(--accent); cursor: pointer; font-size: 1.1rem; margin-bottom: 1rem; display: inline-block; }
        .back-link:hover { color: #f472b6; }
        .exercise-select { display: flex; gap: 0.75rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: linear-gradient(135deg, #ec4899, #db2777);
            color: #000;
            padding: 1rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 1.05rem;
            box-shadow: 0 10px 40px rgba(236, 72, 153, 0.25);
            display: none;
            z-index: 100;
        }
        .hidden { display: none !important; }
        ::selection { background: rgba(236, 72, 153, 0.3); color: #fff; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: rgba(236, 72, 153, 0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(236, 72, 153, 0.4); }
        @media (max-width: 800px) { main.editing { grid-template-columns: 1fr; } }
        @media (max-width: 600px) {
            .exercise-row { grid-template-columns: 1fr 4rem 4rem 2.5rem; }
            .header-row { display: none; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">FitTrack</div>

    </header>

    <main>
        <!-- LEFT COLUMN -->
        <div id="left-col">
            <div id="days-content">
                <div class="card">
                    <div class="card-title">Add Workout Day</div>
                    <div class="row">
                        <div style="flex: 2;">
                            <label for="new-day-name">Day name</label>
                            <input type="text" id="new-day-name" placeholder="e.g. Push Day, Pull Day">
                        </div>
                        <div>
                            <button class="btn btn-primary" id="add-day" style="width: 100%;">Add Day</button>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-title">Your Split</div>
                    <div id="day-list"></div>
                </div>
            </div>

            <div id="day-editor" class="hidden">
                <a class="back-link" id="back-to-days">← Back to days</a>
                <div class="card">
                    <label for="day-name">Day name</label>
                    <input type="text" id="day-name">
                </div>

                <div class="card timer-card">
                    <div class="card-title" style="margin:0">Rest Timer</div>
                    <div class="timer-display" id="timer">00:00</div>
                    <div class="timer-controls">
                        <button class="btn btn-primary" id="timer-toggle">Start Timer</button>
                        <button class="btn btn-secondary" id="timer-reset">Reset</button>
                    </div>
                    <div class="quick-times">
                        <button data-time="30">30s</button>
                        <button data-time="60">1m</button>
                        <button data-time="90">1m 30s</button>
                        <button data-time="120">2m</button>
                        <button data-time="180">3m</button>
                        <button data-time="300">5m</button>
                    </div>
                    <p id="timer-done" class="hidden" style="margin-top:1rem; color:var(--warning); font-weight:700; font-size:1.1rem;">Rest time is up!</p>
                </div>

                <div class="card">
                    <div class="card-title">Exercises</div>
                    <div class="exercise-row header-row">
                        <span>Exercise</span>
                        <span>Sets</span>
                        <span>Reps</span>
                        <span>kg</span>
                        <span></span>
                    </div>
                    <div id="exercises-list"></div>
                    <button class="btn btn-secondary" id="add-exercise" style="margin-top: 0.5rem;">+ Add Exercise</button>
                </div>

                <div class="card">
                    <div class="row" style="justify-content: space-between; align-items: center;">
                        <div>
                            <div class="last-saved" id="last-saved">Never tracked yet</div>
                        </div>
                        <button class="btn btn-primary" id="save-progress" style="padding: 0.85rem 1.25rem;">Save Today's Progress</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- RIGHT COLUMN -->
        <div id="right-col" class="hidden">
            <div class="card">
                <div class="card-title">Overall Progress</div>
                <div class="progress-grid">
                    <div class="stat-box"><div class="value" id="stat-days">0</div><div class="label">Days</div></div>
                    <div class="stat-box"><div class="value" id="stat-exercises">0</div><div class="label">Exercises</div></div>
                    <div class="stat-box"><div class="value" id="stat-sessions">0</div><div class="label">Sessions</div></div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">Exercise Progress</div>
                <div class="exercise-select">
                    <label for="progress-select" style="margin:0;">Pick exercise:</label>
                    <select id="progress-select" style="margin:0; min-width: 220px;">
                        <option value="">Select an exercise</option>
                    </select>
                </div>
                <div id="exercise-chart-area">
                    <div class="empty-state" style="padding: 2rem 0;">
                        <h2 style="font-size: 1rem;">No exercise selected</h2>
                        <p>Choose an exercise above to see its progress chart.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="toast" class="toast"></div>

    <script>
        const STORAGE_KEY = 'fittrack_split_data';
        const $ = id => document.getElementById(id);
        let { days, history } = loadData();
        let currentDayId = null;

        function loadData() {
            const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
            return { days: data.days || [], history: data.history || {} };
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ days, history }));
        }

        function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

        function toast(msg) {
            const t = $('toast');
            t.textContent = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2200);
        }

        function formatDate(d) {
            return new Date(d + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        }

        function renderDays() {
            const list = $('day-list');
            if (days.length === 0) {
                list.innerHTML = '<div class="empty-state"><h2>No days yet</h2><p>Create Push Day, Pull Day, Leg Day and add your exercises.</p></div>';
                return;
            }
            list.innerHTML = days.map(d => `
                <div class="day-card" onclick="openDay('${d.id}')">
                    <div>
                        <h3>${d.name}</h3>
                        <small>${d.exercises.length} exercises · ${(history[d.id] || []).length} sessions tracked</small>
                    </div>
                    <div style="display:flex;align-items:center;gap:0.5rem;">
                        <button class="btn btn-danger btn-icon-sm" onclick="event.stopPropagation();deleteDayConfirm('${d.id}')">✕</button>
                        <div class="arrow">→</div>
                    </div>
                </div>
            `).join('');
        }

        function openDay(id) {
            currentDayId = id;
            const day = days.find(d => d.id === id);
            if (!day) return;
            $('day-name').value = day.name;
            renderExercises();
            updateLastSaved();
            $('days-content').classList.add('hidden');
            $('day-editor').classList.remove('hidden');
            $('right-col').classList.remove('hidden');
            document.querySelector('main').classList.add('editing');
            $('progress-select').value = '';
            renderProgress();
        }

        function updateLastSaved() {
            const sessions = history[currentDayId] || [];
            const text = sessions.length ? `Last tracked: ${formatDate(sessions[sessions.length - 1].date)}` : 'Never tracked yet';
            $('last-saved').textContent = text;
        }

        function addDay() {
            const name = $('new-day-name').value.trim();
            if (!name) { toast('Enter a day name'); return; }
            const id = uid();
            days.push({ id, name, exercises: [] });
            history[id] = history[id] || [];
            saveData();
            $('new-day-name').value = '';
            renderDays();
            toast('Day added');
        }

        function deleteDayConfirm(id) {
            if (!confirm('Delete this day and its progress history?')) return;
            days = days.filter(d => d.id !== id);
            delete history[id];
            if (currentDayId === id) {
                currentDayId = null;
                $('days-content').classList.remove('hidden');
                $('day-editor').classList.add('hidden');
                $('right-col').classList.add('hidden');
                document.querySelector('main').classList.remove('editing');
            }
            saveData();
            renderDays();
            renderProgress();
            toast('Day deleted');
        }

        function addExercise() {
            const day = days.find(d => d.id === currentDayId);
            day.exercises.push({ id: uid(), name: '', sets: 2, reps: 10, weight: '' });
            saveData();
            renderExercises();
        }

        function removeExercise(ei) {
            const day = days.find(d => d.id === currentDayId);
            const ex = day.exercises[ei];
            if (history[ex.id]) delete history[ex.id];
            day.exercises.splice(ei, 1);
            saveData();
            renderExercises();
        }

        let draggedIndex = null;

        function dragStart(e, index) {
            draggedIndex = index;
            e.target.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function dragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            const row = e.target.closest('.exercise-row');
            if (row) row.classList.add('drag-over');
        }

        function dragEnd(e) {
            e.target.classList.remove('dragging');
            document.querySelectorAll('.exercise-row.drag-over').forEach(el => el.classList.remove('drag-over'));
        }

        function dropExercise(e, dropIndex) {
            e.preventDefault();
            if (draggedIndex === null || draggedIndex === dropIndex) return;
            const day = days.find(d => d.id === currentDayId);
            const [moved] = day.exercises.splice(draggedIndex, 1);
            day.exercises.splice(dropIndex, 0, moved);
            draggedIndex = null;
            saveData();
            renderExercises();
        }

        function updateExercise(ei, field, value) {
            const day = days.find(d => d.id === currentDayId);
            if (field === 'sets' || field === 'reps') {
                let v = parseInt(value, 10);
                if (isNaN(v) || v < 0) v = 0;
                day.exercises[ei][field] = v;
            } else if (field === 'weight') {
                let v = parseFloat(value);
                if (isNaN(v) || v < 0) v = 0;
                day.exercises[ei][field] = v;
            } else {
                day.exercises[ei][field] = value;
            }
            saveData();
        }

        function renderExercises() {
            const day = days.find(d => d.id === currentDayId);
            $('exercises-list').innerHTML = day.exercises.map((ex, ei) => `
                <div class="exercise-row" draggable="true" ondragstart="dragStart(event, ${ei})" ondragover="dragOver(event)" ondrop="dropExercise(event, ${ei})" ondragend="dragEnd(event)">
                    <input class="name" type="text" placeholder="Exercise name" value="${escapeHtml(ex.name)}" onchange="updateExercise(${ei},'name',this.value)">
                    <input type="number" min="0" max="50" placeholder="Sets" value="${ex.sets}" onchange="updateExercise(${ei},'sets',this.value)" oninput="validateNumber(this, 0, 50)">
                    <input type="number" min="0" max="100" placeholder="Reps" value="${ex.reps}" onchange="updateExercise(${ei},'reps',this.value)" oninput="validateNumber(this, 0, 100)">
                    <input type="number" min="0" max="1000" step="0.1" placeholder="kg" value="${ex.weight}" onchange="updateExercise(${ei},'weight',this.value)" oninput="validateNumber(this, 0, 1000)">
                    <button class="btn btn-danger btn-icon" onclick="removeExercise(${ei})">✕</button>
                </div>
            `).join('');
        }

        function validateNumber(input, min, max) {
            let v = parseFloat(input.value);
            if (isNaN(v) || v < min) input.value = min;
            else if (v > max) input.value = max;
        }

        function saveDayProgress() {
            const now = new Date();
            const date = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            const day = days.find(d => d.id === currentDayId);
            let tracked = 0;
            day.exercises.forEach(ex => {
                if (!ex.name.trim()) return;
                let sets = parseInt(ex.sets, 10);
                let reps = parseInt(ex.reps, 10);
                let weight = parseFloat(ex.weight);
                if (isNaN(sets) || sets < 0) sets = 0;
                if (isNaN(reps) || reps < 0) reps = 0;
                if (isNaN(weight) || weight < 0) weight = 0;
                history[ex.id] = history[ex.id] || [];
                // replace any entry for same date
                history[ex.id] = history[ex.id].filter(entry => entry.date !== date);
                history[ex.id].push({
                    date,
                    sets,
                    reps,
                    weight
                });
                tracked++;
            });
            // track day session
            history[currentDayId] = history[currentDayId] || [];
            history[currentDayId] = history[currentDayId].filter(s => s.date !== date);
            history[currentDayId].push({ date });
            saveData();
            updateLastSaved();
            renderExercises();
            renderProgress();
            toast(tracked ? `Progress saved for ${tracked} exercises` : 'No exercises to save');
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
        }

        /* --------------- TIMER --------------- */
        let timerInterval = null;
        let remainingSeconds = 0;
        let timerRunning = false;

        function formatTime(sec) {
            const m = Math.floor(sec / 60).toString().padStart(2, '0');
            const s = (sec % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateTimerDisplay() {
            $('timer').textContent = formatTime(remainingSeconds);
            document.title = timerRunning ? `${formatTime(remainingSeconds)} - FitTrack` : 'FitTrack';
        }

        function startTimer() {
            if (timerRunning) return;
            if (remainingSeconds <= 0) remainingSeconds = 180;
            timerRunning = true;
            $('timer-toggle').textContent = 'Pause';
            $('timer-done').classList.add('hidden');
            timerInterval = setInterval(() => {
                remainingSeconds--;
                updateTimerDisplay();
                if (remainingSeconds <= 0) {
                    clearInterval(timerInterval);
                    timerRunning = false;
                    $('timer-toggle').textContent = 'Start Timer';
                    $('timer-done').classList.remove('hidden');
                    if (Notification.permission === 'granted') new Notification('FitTrack', { body: 'Rest time is up!' });
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            timerRunning = false;
            $('timer-toggle').textContent = 'Resume';
        }

        function toggleTimer() {
            if (timerRunning) pauseTimer(); else startTimer();
            updateTimerDisplay();
        }

        function resetTimer() {
            pauseTimer();
            remainingSeconds = 0;
            $('timer-toggle').textContent = 'Start Timer';
            $('timer-done').classList.add('hidden');
            updateTimerDisplay();
        }

        function setTimer(seconds) {
            pauseTimer();
            remainingSeconds = parseInt(seconds);
            $('timer-done').classList.add('hidden');
            updateTimerDisplay();
            startTimer();
        }

        /* --------------- PROGRESS --------------- */
        function renderProgress() {
            let totalExercises = 0, sessions = 0;
            const dayFilter = currentDayId ? days.filter(d => d.id === currentDayId) : days;
            dayFilter.forEach(d => {
                totalExercises += d.exercises.length;
                sessions += (history[d.id] || []).length;
            });
            $('stat-days').textContent = currentDayId ? 1 : days.length;
            $('stat-exercises').textContent = totalExercises;
            $('stat-sessions').textContent = sessions;

            const select = $('progress-select');
            const oldVal = select.value;
            select.innerHTML = '<option value="">Select an exercise</option>';
            dayFilter.forEach(d => {
                d.exercises.forEach(ex => {
                    if (!ex.name.trim()) return;
                    const opt = document.createElement('option');
                    opt.value = ex.id;
                    opt.textContent = ex.name;
                    select.appendChild(opt);
                });
            });
            if (oldVal) select.value = oldVal;
            if (select.value && history[select.value]) {
                renderExerciseChart(select.value);
            } else {
                $('exercise-chart-area').innerHTML = '<div class="empty-state" style="padding: 2rem 0;"><h2 style="font-size:1rem">Select an exercise</h2><p>Choose an exercise above to see its progress chart.</p></div>';
            }
        }

        function renderExerciseChart(exerciseId) {
            const entries = (history[exerciseId] || []).slice().sort((a, b) => new Date(a.date) - new Date(b.date));
            const area = $('exercise-chart-area');
            if (entries.length === 0) {
                area.innerHTML = '<div class="empty-state" style="padding: 2rem 0;"><h2 style="font-size:1rem">No data yet</h2><p>Save progress for this exercise to build a chart.</p></div>';
                return;
            }
            const repsArr = entries.map(e => parseFloat(e.reps) || 0);
            const weightArr = entries.map(e => parseFloat(e.weight) || 0);
            const maxReps = Math.max(...repsArr, 1);
            const maxWeight = Math.max(...weightArr, 1);
            const w = 800, h = 220, pad = 30;
            const usableW = w - pad * 2;
            const usableH = h - pad * 2;

            function point(i, val, max) {
                const x = pad + (entries.length === 1 ? usableW / 2 : i / (entries.length - 1) * usableW);
                const y = h - pad - (val / max) * usableH;
                return `${x},${y}`;
            }

            const weightPoints = weightArr.map((v, i) => point(i, v, maxWeight)).join(' ');
            const repsPoints = repsArr.map((v, i) => point(i, v, maxReps)).join(' ');

            const labels = entries.map((e, i) => {
                const x = pad + (entries.length === 1 ? usableW / 2 : i / (entries.length - 1) * usableW);
                return `<text x="${x}" y="${h - 8}" text-anchor="middle" fill="var(--text-muted)" font-size="11">${formatDate(e.date)}</text>`;
            }).join('');

            const latest = entries[entries.length - 1];
            const bestSet = entries.reduce((a, b) => (parseFloat(a.weight) || 0) > (parseFloat(b.weight) || 0) ? a : b);
            const bestWeight = parseFloat(bestSet.weight) || 0;
            const bestReps = parseFloat(bestSet.reps) || 0;
            const bestVolume = entries.reduce((max, e, i) => Math.max(max, (parseFloat(e.reps) || 0) * (parseFloat(e.weight) || 0)), 0);

            area.innerHTML = `
                <div class="chart-header">
                    <div style="font-size:0.9rem;color:var(--text-muted)">Latest: <strong style="color:var(--text)">${latest.weight || 0} kg × ${latest.reps || 0} reps</strong> on ${formatDate(latest.date)}</div>
                    <div class="chart-legend">
                        <span><span class="legend-dot" style="background:var(--accent)"></span>Weight (kg)</span>
                        <span><span class="legend-dot" style="background:var(--info)"></span>Reps</span>
                    </div>
                </div>
                <div class="chart-card">
                    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">
                        <polyline fill="none" stroke="var(--accent)" stroke-width="3" points="${weightPoints}" />
                        <polyline fill="none" stroke="var(--info)" stroke-width="3" stroke-dasharray="6 4" points="${repsPoints}" />
                        ${weightArr.map((v, i) => `<circle cx="${pad + (entries.length === 1 ? usableW / 2 : i / (entries.length - 1) * usableW)}" cy="${h - pad - (v / maxWeight) * usableH}" r="4" fill="var(--accent)" />`).join('')}
                        ${repsArr.map((v, i) => `<circle cx="${pad + (entries.length === 1 ? usableW / 2 : i / (entries.length - 1) * usableW)}" cy="${h - pad - (v / maxReps) * usableH}" r="4" fill="var(--info)" />`).join('')}
                        ${labels}
                    </svg>
                </div>
                <div class="progress-grid" style="margin-top:1rem;margin-bottom:0">
                    <div class="stat-box"><div class="value">${bestWeight}</div><div class="label">Best Weight (kg)</div></div>
                    <div class="stat-box"><div class="value">${bestReps}</div><div class="label">Best Reps</div></div>
                    <div class="stat-box"><div class="value">${entries.length}</div><div class="label">Sessions</div></div>
                </div>
            `;
        }

        /* --------------- EVENT BINDINGS --------------- */
        $('add-day').addEventListener('click', addDay);
        $('new-day-name').addEventListener('keypress', e => { if (e.key === 'Enter') addDay(); });
        $('add-exercise').addEventListener('click', addExercise);
        $('save-progress').addEventListener('click', saveDayProgress);
        $('back-to-days').addEventListener('click', () => { $('days-content').classList.remove('hidden'); $('day-editor').classList.add('hidden'); $('right-col').classList.add('hidden'); document.querySelector('main').classList.remove('editing'); renderDays(); renderProgress(); });
        $('day-name').addEventListener('change', (e) => {
            const day = days.find(d => d.id === currentDayId);
            day.name = e.target.value.trim() || day.name;
            saveData();
        });

        $('timer-toggle').addEventListener('click', toggleTimer);
        $('timer-reset').addEventListener('click', resetTimer);
        document.querySelectorAll('.quick-times button').forEach(b => b.addEventListener('click', () => setTimer(b.dataset.time)));

        $('progress-select').addEventListener('change', (e) => renderExerciseChart(e.target.value));



        // Init
        renderDays();
        renderProgress();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
