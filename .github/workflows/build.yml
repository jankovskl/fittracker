name: Build FitTrack installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: fittrack-installer
          path: app/dist/*.exe

      - name: Create GitHub Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "$env:GITHUB_REF_NAME"
          $exe = Get-ChildItem "dist\*.exe" | Select-Object -First 1 -ExpandProperty FullName
          if (-not (gh release view $tag 2>$null)) { gh release create $tag "$exe" --generate-notes }
          else { gh release upload $tag "$exe" --clobber }